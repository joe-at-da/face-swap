services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data/media:/app/media
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/parliament_clips
      - TEST_DATABASE_URL=postgresql://postgres:postgres@db:5432/test_parliament_clips
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=dev_secret_key
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000,http://0.0.0.0:3000
      - SUPABASE_URL=http://127.0.0.1:54321
      - SUPABASE_STORAGE_URL=http://127.0.0.1:54321/storage/v1/s3
      - SUPABASE_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - SUPABASE_INTEGRATION_ENABLED=true
      - SUPABASE_MEDIA_BUCKET=parliament-tv-media
      - SUPABASE_EXPORT_BUCKET=parliament-tv-exports
      - SUPABASE_FULL_VIDEOS_BUCKET=full_videos
      - INTEGRATION_API_KEY=8448700525
    depends_on:
      - db
      - redis
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - app

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=parliament_clips
      - POSTGRES_TEST_DB=test_parliament_clips

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - ./data/media:/app/media
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/parliament_clips
      - TEST_DATABASE_URL=postgresql://postgres:postgres@db:5432/test_parliament_clips
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SUPABASE_URL=http://127.0.0.1:54321
      - SUPABASE_STORAGE_URL=http://127.0.0.1:54321/storage/v1/s3
      - SUPABASE_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - SUPABASE_INTEGRATION_ENABLED=true
      - SUPABASE_MEDIA_BUCKET=parliament-tv-media
      - SUPABASE_EXPORT_BUCKET=parliament-tv-exports
      - SUPABASE_FULL_VIDEOS_BUCKET=full_videos
      - INTEGRATION_API_KEY=8448700525
    depends_on:
      - redis
      - db
    command: celery -A backend.worker:celery_app worker --loglevel=info

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
